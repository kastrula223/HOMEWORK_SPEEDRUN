<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Космічна галерея</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .card {
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }


        .card-star {
            background-color: #1e293b;
        }

        .card-planet {
            background-color: #312e81;
        }

        .card-galaxy {
            background-color: #4c1d95;
        }

        .card h3 {
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <h1>Космічна галерея</h1>

    <div class="gallery">
        <div class="card card-star">
            <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=400" alt="Зірки">
            <h3>Сонце та Зірки</h3>
            <p>Гігантські кулі з палаючого газу, що випромінюють світло й тепло.</p>
        </div>

        <div class="card card-planet">
            <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=400" alt="Марс">
            <h3>Планета Марс</h3>
            <p>Четверта планета від Сонця з характерним червонуватим відтінком.</p>
        </div>


        <div class="card card-galaxy">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=400" alt="Галактика">
            <h3>Чумацький Шлях</h3>
            <p>Спіральна галактика, яка містить нашу Сонячну систему.</p>
        </div>
    </div>

</body>
</html>
