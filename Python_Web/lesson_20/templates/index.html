<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Перегляд текстового файлу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            text-align: center;
            margin-bottom: 30px;
        }
        input[type="file"] {
            padding: 8px;
        }
        button {
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }
        .error {
            color: #b00020;
            background: #fdecea;
            border: 1px solid #f5c6cb;
            padding: 10px 15px;
            border-radius: 4px;
            text-align: center;
        }
        .filename {
            font-weight: bold;
            margin-bottom: 10px;
        }
        pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Перегляд вмісту текстового файлу</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".txt,.csv,.log,.md,.json" required>
        <button type="submit">Завантажити</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if content is not none %}
        <div class="filename">Файл: {{ filename }}</div>
        <pre>{{ content }}</pre>
    {% endif %}
</body>
</html>
